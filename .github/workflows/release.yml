name: Release builds

# Builds every platform except iOS when a GitHub release is published, injects
# the version from the tag (so pubspec can stay at 1.0.0), and attaches the
# artifacts to the release. iOS is built and versioned through Xcode Cloud / App
# Store Connect separately.
on:
  release:
    types: [published]
  # Manual runs build the artifacts but don't upload them.
  workflow_dispatch:

# Let the default GITHUB_TOKEN attach artifacts to the release (otherwise the
# upload fails with "Resource not accessible by integration" / HTTP 403).
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  # NOTE: the GitHub Pages demo deploys from `main` in a separate workflow
  # (pages.yml) — the github-pages environment blocks deploys from release tags.

  # Web production image → GitHub Container Registry. Build the web bundle with
  # the pinned toolchain, then package it into the runtime-only nginx image
  # (the Dockerfile just copies build/web — no Flutter base image).
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Resolve version from tag
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          echo "VERSION=${V:-0.0.0-manual}" >> "$GITHUB_ENV"
      - run: flutter pub get
      # Container serves from the root, so no --base-href (unlike Pages).
      - run: flutter build web --release --dart-define=APP_VERSION=$VERSION
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Only push on a real release; manual runs just verify the build.
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/daniel-hiller/jellymusic:${{ env.VERSION }}
            ghcr.io/daniel-hiller/jellymusic:latest

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv \
            libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev

      - name: Resolve version from tag
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          echo "VERSION=${V:-0.0.0-manual}" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APP_VERSION=$VERSION
      - name: Package
        run: |
          tar -C build/linux/x64/release/bundle -czf \
            jellymusic-linux-x64-$VERSION.tar.gz .
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" jellymusic-linux-x64-$VERSION.tar.gz --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Resolve version from tag
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          echo "VERSION=${V:-0.0.0-manual}" >> "$GITHUB_ENV"
      - run: flutter pub get
      # Release APK, signed with the debug key (see android/app/build.gradle.kts).
      # For Play Store uploads, add a keystore + signing secrets and build an
      # app bundle instead.
      - run: >
          flutter build apk --release
          --dart-define=APP_VERSION=$VERSION
          --build-name=$VERSION --build-number=${{ github.run_number }}
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk jellymusic-$VERSION.apk
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" jellymusic-$VERSION.apk --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Resolve version from tag
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          echo "VERSION=${V:-0.0.0-manual}" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_VERSION=%VERSION% --build-name=%VERSION% --build-number=${{ github.run_number }}
        shell: cmd
      - name: Package (portable zip)
        shell: bash
        run: (cd build/windows/x64/runner/Release && 7z a ../../../../../jellymusic-windows-x64-$VERSION.zip .)
      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% "/DBuildDir=%CD%\build\windows\x64\runner\Release" windows\installer\jellymusic.iss
      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" jellymusic-windows-x64-$VERSION.zip --clobber
          gh release upload "${{ github.event.release.tag_name }}" "windows/installer/Output/jellymusic-windows-x64-$VERSION-setup.exe" --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Resolve version from tag
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          echo "VERSION=${V:-0.0.0-manual}" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: >
          flutter build macos --release
          --dart-define=APP_VERSION=$VERSION
          --build-name=$VERSION --build-number=${{ github.run_number }}
      # Unsigned .app — Gatekeeper will warn until it's signed/notarised.
      - name: Package
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" jellymusic-macos-$VERSION.zip
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" jellymusic-macos-$VERSION.zip --clobber

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv \
            libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev \
            flatpak flatpak-builder
      - name: Resolve version from tag
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          echo "VERSION=${V:-0.0.0-manual}" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APP_VERSION=$VERSION
      - name: Assemble flatpak build context
        run: |
          rm -rf flatpak/build-context
          mkdir -p flatpak/build-context
          cp -r build/linux/x64/release/bundle flatpak/build-context/bundle
          cp flatpak/jellymusic.sh flatpak/build-context/
          cp flatpak/io.github.daniel_hiller.jellymusic.desktop flatpak/build-context/
          cp flatpak/io.github.daniel_hiller.jellymusic.metainfo.xml flatpak/build-context/
          cp flatpak/icon.png flatpak/build-context/icon.png
      - name: Install Flatpak runtimes
        run: |
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Platform.ffmpeg-full//24.08
      # The manifest forces --libdir=lib, so the distro flatpak-builder installs
      # every module to /app/lib and pkg-config resolves libplacebo for mpv.
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo flatpak-build \
            flatpak/io.github.daniel_hiller.jellymusic.yml
          flatpak build-bundle flatpak-repo \
            jellymusic-linux-$VERSION.flatpak \
            io.github.daniel_hiller.jellymusic
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" jellymusic-linux-$VERSION.flatpak --clobber
