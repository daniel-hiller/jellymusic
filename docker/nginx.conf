# Serves the Flutter web bundle. The app is a single-page app with
# client-side routing (go_router), so unknown paths must fall back to
# index.html instead of 404-ing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the bootstrap files: a stale index.html or service worker
    # would pin clients to an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets (main.dart.js, canvaskit, fonts) are safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}
